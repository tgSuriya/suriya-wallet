<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suriya Wallet</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f8;
  color:#111827;
}

.header{
  background:#111827;
  color:white;
  padding:22px 18px;
  border-radius:0 0 25px 25px;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.subtitle{
  margin-top:5px;
  opacity:.7;
  font-size:13px;
}

.container{
  max-width:500px;
  margin:auto;
  padding:18px;
}

.balance{
  background:linear-gradient(135deg,#111827,#374151);
  color:white;
  padding:25px;
  border-radius:20px;
  margin-top:18px;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.balance small{
  opacity:.75;
}

.amount{
  font-size:32px;
  font-weight:bold;
  margin-top:8px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:18px;
}

.action{
  background:white;
  padding:18px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
  cursor:pointer;
}

.action span{
  display:block;
  font-size:26px;
  margin-bottom:7px;
}

.section{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-top:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.section h3{
  margin-bottom:15px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:12px;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#111827;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.history{
  margin-top:10px;
}

.transaction{
  display:flex;
  justify-content:space-between;
  padding:13px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.success{
  color:#16a34a;
  font-weight:bold;
}

.footer{
  text-align:center;
  padding:25px;
  color:#777;
  font-size:12px;
}
</style>
</head>

<body>

<div class="header">
  <div class="container">
    <div class="logo">💳 Suriya Wallet</div>
    <div class="subtitle">Simple • Secure • Fast</div>
  </div>
</div>

<div class="container">

  <div class="balance">
    <small>Available Balance</small>
    <div class="amount">₹0.00</div>
  </div>

  <div class="actions">

    <div class="action" onclick="showMessage('Add Money feature will be connected later.')">
      <span>➕</span>
      Add Money
    </div>

    <div class="action" onclick="document.getElementById('transfer').scrollIntoView()">
      <span>📤</span>
      Send Money
    </div>

    <div class="action" onclick="showMessage('Withdraw feature will be connected later.')">
      <span>💸</span>
      Withdraw
    </div>

    <div class="action" onclick="document.getElementById('history').scrollIntoView()">
      <span>📜</span>
      History
    </div>

  </div>

  <div class="section" id="transfer">
    <h3>📱 Send Money</h3>

    <input
      type="tel"
      id="mobile"
      placeholder="Receiver Mobile Number"
      maxlength="10"
    >

    <input
      type="number"
      id="amount"
      placeholder="Enter Amount ₹"
      min="1"
    >

    <button onclick="sendMoney()">Send Money</button>
  </div>

  <div class="section" id="history">
    <h3>📜 Recent Transactions</h3>

    <div class="history">
      <div class="transaction">
        <span>Wallet Created</span>
        <span class="success">₹0.00</span>
      </div>
    </div>
  </div>

  <div class="footer">
    © 2026 Suriya Wallet<br>
    Wallet-to-Wallet Payment System
  </div>

</div>

<script>

function showMessage(message){
  alert(message);
}

function sendMoney(){

  const mobile = document.getElementById("mobile").value;
  const amount = document.getElementById("amount").value;

  if(mobile.length !== 10){
    alert("Please enter a valid 10-digit mobile number.");
    return;
  }

  if(amount === "" || Number(amount) <= 0){
    alert("Please enter a valid amount.");
    return;
  }

  alert(
    "Transfer request created!\n\n" +
    "Receiver: " + mobile +
    "\nAmount: ₹" + amount +
    "\n\nReal transfer will be connected with the backend later."
  );
}

</script>

</body>
</html>
